# Render Blueprint — deploys the FastAPI backend as a Docker web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-newsletter-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: APP_ACCESS_KEY
        sync: false
      - key: ALLOW_BYOK
        value: "true"
      - key: CORS_ORIGINS
        value: https://YOUR-FRONTEND.vercel.app
      - key: DEFAULT_MODEL
        value: openai/gpt-oss-120b
      - key: FALLBACK_MODELS
        value: qwen/qwen3.8-27b,openai/gpt-oss-20b
